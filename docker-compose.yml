services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Vinhtu3624@}
      MYSQL_DATABASE: microservice
    volumes:
      - mysql-data:/var/lib/mysql
      - ./microservice.sql:/docker-entrypoint-initdb.d/microservice.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-Vinhtu3624@}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  department-service:
    image: department-service:v1
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8082}:${APP_PORT:-8082}'
    environment:
      APP_PORT: ${APP_PORT:-8082}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/microservice?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Vinhtu3624@}
      SPRING_CLOUD_CONFIG_ENABLED: ${SPRING_CLOUD_CONFIG_ENABLED:-false}
    restart: always

volumes:
  mysql-data:
