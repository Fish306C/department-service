on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mvn
        run: |
          .\mvnw.cmd clean package -DskipTests

      - name: Start Docker Desktop
        shell: powershell
        run: |
          $dockerDesktop = "${env:ProgramFiles}\Docker\Docker\Docker Desktop.exe"
          if (Test-Path $dockerDesktop) {
            Start-Process $dockerDesktop
          }

          for ($i = 1; $i -le 60; $i++) {
            docker info
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker is ready."
              exit 0
            }

            Write-Host "Waiting for Docker to start..."
            Start-Sleep -Seconds 5
          }

          Write-Error "Docker is not running. Please start Docker Desktop and make sure it is using Linux containers."
          exit 1

      - name: Build and tag Docker image
        run: |
          docker build -t department-service:v1 .


  deploy:
    env:
      APP_PORT: ${{ secrets.APP_PORT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    runs-on: [self-hosted]
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check Docker
        shell: powershell
        run: |
          docker info

      - name: Validate deployment variables
        shell: powershell
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:DB_URL)) {
            $missing += "DB_URL"
          }

          if ([string]::IsNullOrWhiteSpace($env:DB_USERNAME)) {
            $missing += "DB_USERNAME"
          }

          if ([string]::IsNullOrWhiteSpace($env:DB_PASSWORD)) {
            $missing += "DB_PASSWORD"
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing GitHub Actions secrets: $($missing -join ', ')"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:APP_PORT)) {
            Write-Host "APP_PORT is not set. Docker Compose will use default port 8082."
          }

      - name: Stop and Remove Existing Containers
        continue-on-error: true
        run: docker compose down

      - name: Run with Docker Compose
        run: docker compose up -d
