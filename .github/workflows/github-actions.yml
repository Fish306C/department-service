name: Build and Deploy

on:
  push:
    branches:
      - dev
      - production


env:
  IMAGE_NAME: department-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Maven
        run: .\mvnw.cmd clean package -DskipTests

      - name: Build Docker image
        run: docker build -t "${env:IMAGE_NAME}:${env:IMAGE_TAG}" .

  deploy-dev:
    runs-on: [self-hosted]
    needs: build
    if: github.ref == 'refs/heads/dev'
    environment: dev

    env:
      APP_PORT: ${{ secrets.APP_PORT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Stop and Remove Existing Containers
        run: |
          docker compose down
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existing containers to stop."
          }
          exit 0

      - name: Run with Docker Compose
        run: docker compose up -d

  deploy-production:
    runs-on: [self-hosted]
    needs: build
    if: github.ref == 'refs/heads/production'
    environment: production

    env:
      APP_PORT: ${{ secrets.APP_PORT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Load image into Minikube
        run: minikube image load "${env:IMAGE_NAME}:${env:IMAGE_TAG}"

      - name: Create or update Kubernetes secret
        run: |
          kubectl create secret generic department-service-secret `
            --from-literal=APP_PORT="$env:APP_PORT" `
            --from-literal=DB_URL="$env:DB_URL" `
            --from-literal=DB_USERNAME="$env:DB_USERNAME" `
            --from-literal=DB_PASSWORD="$env:DB_PASSWORD" `
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render Kubernetes manifests
        run: |
          $files = @("deployment", "service")
          foreach ($file in $files) {
            $content = Get-Content "k8s/$file.yaml" -Raw
            $content = $content.Replace('${IMAGE_NAME}', $env:IMAGE_NAME)
            $content = $content.Replace('${IMAGE_TAG}', $env:IMAGE_TAG)
            $content = $content.Replace('${APP_PORT}', $env:APP_PORT)
            Set-Content "k8s/$file-rendered.yaml" -Value $content -Encoding utf8
          }

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/deployment-rendered.yaml
          kubectl apply -f k8s/service-rendered.yaml

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/department-service
          kubectl rollout status deployment/department-service
          
          
          
